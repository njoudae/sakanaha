name: Quality Gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, test, secure, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      HUSKY: "0"
    steps:
      - name: Check out reviewed revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --include=dev

      - name: Validate environment templates
        run: npm run validate:environment

      - name: Validate deployment and workflow configuration
        run: npm run validate:deployment

      - name: Scan tracked files for secrets
        run: npm run security:scan

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run all tests
        run: npm test

      - name: Run adversarial security tests
        run: npm run test:security

      - name: Audit dependencies
        run: npm audit --audit-level=low

      - name: Build production artifact
        run: npm run build

      - name: Validate production artifact
        run: npm run validate:deployment -- --artifact

      - name: Validate patch whitespace
        run: git diff --check

      - name: Retain reviewed web artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-dist-${{ github.sha }}
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 14
